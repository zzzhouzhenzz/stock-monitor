[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-monitor"
version = "0.1.0"
description = "Portable price-and-volume alert prototype"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
stock-monitor = "stock_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
